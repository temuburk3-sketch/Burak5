                    <button onclick="saveSupplier()" style="width: 100%; padding: 6px; background: ${theme.success}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✅ Kaydet</button>
                </div>

                <div id="sup-list"></div>
            `;

            window.togglePurchaseForm = function(type) {
                const form = document.getElementById('purchase-form');
                const supplierDiv = document.getElementById('supplier-select-div');
                
                if (type === 'anonymous') {
                    supplierDiv.style.display = 'none';
                } else {
                    supplierDiv.style.display = 'block';
                }
                
                form.classList.toggle('hidden');
            };

            window.autoFillSellPrice = function() {
                const productId = parseInt(document.getElementById('purchase-product').value);
                const product = state.products.find(p => p.id === productId);
                
                if (product) {
                    document.getElementById('purchase-sell-price').value = product.sellPrice;
                }
            };

            window.savePurchase = function() {
                const productId = parseInt(document.getElementById('purchase-product').value);
                const quantity = parseInt(document.getElementById('purchase-quantity').value);
                const buyPrice = parseFloat(document.getElementById('purchase-buy-price').value);
                const sellPrice = parseFloat(document.getElementById('purchase-sell-price').value);
                const supplierId = document.getElementById('purchase-supplier').value;

                if (!productId || !quantity || !buyPrice || !sellPrice) {
                    alert('⚠️ Tüm alanları doldurun!');
                    return;
                }

                const product = state.products.find(p => p.id === productId);
                if (!product) return;

                // stockLots'a ekle (alış + satış fiyatı ile)
                if (!product.stockLots) product.stockLots = [];
                product.stockLots.push({
                    buyPrice: buyPrice,
                    sellPrice: sellPrice,
                    quantity: quantity,
                    date: new Date().toLocaleString('tr-TR')
                });

                // Ürünün genel satış fiyatını güncelle
                product.sellPrice = sellPrice;

                // Depo stokunu güncelle
                product.warehouse += quantity;

                // Satın alım kaydı
                const purchase = {
                    id: Date.now(),
                    productId: productId,
                    productName: product.name,
                    supplierId: supplierId || 'anonymous',
                    quantity: quantity,
                    buyPrice: buyPrice,
                    sellPrice: sellPrice,
                    totalAmount: quantity * buyPrice,
                    type: 'in',
                    date: new Date().toLocaleString('tr-TR')
                };
                state.stockLog.push(purchase);

                // AUDIT LOG: Tedarik alındı
                const supplierName = supplierId ? (state.suppliers.find(s => s.id == supplierId)?.name || 'Bilinmiyor') : 'Isimsiz Alım';
                state.auditLog.push({
                    user: state.user.name,
                    action: '📦 Tedarik Alındı',
                    timestamp: new Date().toLocaleString('tr-TR'),
                    details: `Ürün: ${product.name}, Tedarikçi: ${supplierName}, Alış: ${buyPrice}₺, Satış: ${sellPrice}₺`,
                    affectedData: `${quantity} adet (Toplam: ${(quantity * buyPrice).toFixed(0)}₺)`
                });

                saveData();
                alert(`✅ ${quantity} x ${product.name}\n(Alış: ${buyPrice}₺ | Satış: ${sellPrice}₺)`);
                document.getElementById('purchase-form').classList.add('hidden');
                document.getElementById('purchase-product').value = '';
                document.getElementById('purchase-quantity').value = '';
                document.getElementById('purchase-buy-price').value = '';
                document.getElementById('purchase-sell-price').value = '';
                renderSuppliers(screen);
            };

            window.toggleSupplierForm = function() {
                document.getElementById('sup-form').classList.toggle('hidden');
            };

            window.saveSupplier = function() {
                const s = {
                    id: Date.now(),

                });

                const ctx = document.getElementById('salesChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: last7Days,
                            datasets: [{

                                data: salesData,
                                borderColor: theme.primary,
                                backgroundColor: theme.primary + '20',
                                tension: 0.4
                            }]

            }, 100);

        // ========== DÖNEM RAPORU ==========
        function renderPeriod(screen) {
            const now = new Date();
            let month = now.getMonth() + 1, year = now.getFullYear();

            screen.innerHTML = `
                <div class="grid-2" style="margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 10px; font-weight: bold;">Ay</label>
                        <select id="p-month" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;">
                            ${Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1 === month ? 'selected' : ''}>${i+1}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: bold;">Yıl</label>
                        <select id="p-year" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;">
                            ${Array.from({length: 5}, (_, i) => {
                                const y = new Date().getFullYear() - i;
                                return `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`;
                            }).join('')}
                        </select>
                    </div>
                </div>
                <div id="period-content"></div>
            `;

            function updatePeriod() {
                const m = parseInt(document.getElementById('p-month').value);
                const y = parseInt(document.getElementById('p-year').value);

                const filtered = state.sales.filter(s => {
                    try {
                        const dateStr = s.timestamp.split(',')[0]; // "16.07.2026"
                        const [day, month, year] = dateStr.split('.');
                        return parseInt(month) === m && parseInt(year) === y;
                    } catch { return true; }
                });

                const revenue = filtered.reduce((s, a) => s + (a.total || 0), 0);
                const expense = state.expenses.reduce((s, a) => s + (a.amount || 0), 0);
                const profit = revenue - expense;

                document.getElementById('period-content').innerHTML = `
                    <div class="grid-2" style="margin-bottom: 12px;">
                        <div class="card" style="border-left: 3px solid ${theme.success}; text-align: center;">
                            <div style="font-size: 10px; color: ${theme.textLight};">💰 Gelir</div>
                            <div style="font-size: 16px; font-weight: bold; color: ${theme.success}; margin-top: 5px;">${revenue.toFixed(0)}₺</div>
                        </div>
                        <div class="card" style="border-left: 3px solid ${theme.error}; text-align: center;">
                            <div style="font-size: 10px; color: ${theme.textLight};">💸 Gider</div>
                            <div style="font-size: 16px; font-weight: bold; color: ${theme.error}; margin-top: 5px;">${expense.toFixed(0)}₺</div>
                        </div>
                        <div class="card" style="border-left: 3px solid ${profit > 0 ? theme.success : theme.error}; text-align: center; grid-column: 1/-1;">
                            <div style="font-size: 10px; color: ${theme.textLight};">📊 Kar</div>
                            <div style="font-size: 18px; font-weight: bold; color: ${profit > 0 ? theme.success : theme.error}; margin-top: 5px;">${profit.toFixed(0)}₺</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('p-month').onchange = updatePeriod;
            document.getElementById('p-year').onchange = updatePeriod;
            updatePeriod();
        }

        function renderStockLog(screen) {
            screen.innerHTML = `

                                <option value="">Tüm Hareketler</option>
                                <option value="in">📈 Giriş</option>
                                <option value="out">📉 Çıkış</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 6px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label style="font-size: 9px; color: ${theme.textLight}; display: block; margin-bottom: 4px;">📅 Başlangıç Tarihi</label>
                            <input type="date" id="stock-filter-start-date" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 10px;" onchange="filterStockLog()" />
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 9px; color: ${theme.textLight}; display: block; margin-bottom: 4px;">📅 Bitiş Tarihi</label>
                            <input type="date" id="stock-filter-end-date" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 10px;" onchange="filterStockLog()" />
                        </div>
                        <button onclick="clearDateFilter()" style="padding: 6px 12px; background: ${theme.error}20; color: ${theme.error}; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; height: 28px;">✕ Temizle</button>
                    </div>
                    
                    <div id="stock-log-list" style="margin-top: 12px;"></div>
                </div>
            `;

            window.filterStockLog = function() {
                const productSearch = (document.getElementById('stock-filter-product-search')?.value || '').toLowerCase().trim();
                const type = document.getElementById('stock-filter-type')?.value || '';
                const singleDateInput = document.getElementById('stock-filter-date')?.value || '';
                const startDateInput = document.getElementById('stock-filter-start-date')?.value || '';
                const endDateInput = document.getElementById('stock-filter-end-date')?.value || '';

                let filtered = state.stockLog || [];
                
                // Ürün ismi yazıyla ara
                if (productSearch) {
                    filtered = filtered.filter(log => 
                        (log.productName || '').toLowerCase().includes(productSearch)
                    );
                }

                // Tip filtresi
                if (type) {
                    filtered = filtered.filter(log => log.type === type);
                }

                // Tarih filtresi - Tek Tarih veya Tarih Aralığı
                const startDate = startDateInput || singleDateInput;
                const endDate = endDateInput || singleDateInput;

                if (startDate || endDate) {
                    filtered = filtered.filter(log => {
                        if (!log.date) return false;
                        const logDateFormatted = parseToYYYYMMDD(log.date);
                        if (!logDateFormatted) return false;

                        if (startDate && logDateFormatted < startDate) return false;
                        if (endDate && logDateFormatted > endDate) return false;
                        return true;
                    });
                }

                const list = document.getElementById('stock-log-list');
                if (!list) return;

                if (filtered.length === 0) {
                    list.innerHTML = `<div style="text-align: center; color: ${theme.textLight}; font-size: 11px; padding: 12px;">📭 Sonuç bulunamadı</div>`;
                    return;
                }

                list.innerHTML = filtered.slice().reverse().map(log => `
                    <div style="background: ${theme.card}; padding: 8px; border-radius: 4px; margin-bottom: 6px; border-left: 3px solid ${log.type === 'in' ? theme.success : theme.error}; font-size: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 4px;">
                            <div style="font-weight: bold; color: ${theme.primary};">${log.productName || 'Bilinmeyen Ürün'}</div>
                            <button onclick="deleteStockLog(${log.id})" style="padding: 2px 6px; background: ${theme.error}; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 9px;">🗑️</button>
                        </div>
                        <div style="color: ${log.type === 'in' ? theme.success : theme.error}; font-weight: bold;">${log.type === 'in' ? '📈 Giriş' : '📉 Çıkış'}: ${log.quantity} Adet</div>
                        <div style="color: ${theme.textLight};">📅 ${log.date} | Kullanıcı: ${log.user || 'Sistem'}</div>
                        <div style="color: ${theme.textLight};">Not: ${log.note || '-'}</div>
                    </div>
                `).join('');
            };

            window.clearDateFilter = function() {
                const singleElem = document.getElementById('stock-filter-date');
                const startElem = document.getElementById('stock-filter-start-date');
                const endElem = document.getElementById('stock-filter-end-date');
                if (singleElem) singleElem.value = '';
                if (startElem) startElem.value = '';
                if (endElem) endElem.value = '';
                filterStockLog();
            };

            // İlk yükleme
            filterStockLog();
        }

                btn.addEventListener('click', function(e) {
                    e.preventDefault();

        window.toggleEmojiPicker = function(type, idx) {
            const picker = document.getElementById(`emoji-picker-${type}-${idx}`);
            if (picker.style.maxHeight === '0px' || picker.style.maxHeight === '') {
                picker.style.maxHeight = '180px';
            } else {
                picker.style.maxHeight = '0px';
            }
        };

        window.triggerImageUpload = function(catName) {
            document.getElementById(`image-upload-${catName}`).click();
        };

        window.handleImageUpload = function(event, catName) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Canvas'ta compress et (64x64)
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 64, 64);
                    
                    // DataURL'e çevir
                    const compressedImage = canvas.toDataURL('image/png');
                    
                    // Kategoriye ata
                    state.categoryEmojis[catName] = compressedImage;
                    saveData();
                    
                    // Formu kapat ve aç (güncelle)
                    const type = Object.keys(state.categories).find(t => state.categories[t].includes(catName));
                    if (type) {
                        const elementMap = {
                            'products': 'cat-prod-list',
                            'customers': 'cat-cust-list',
                            'expenses': 'cat-exp-list',
                            'returns': 'cat-ret-list'
                        };
                        window.renderCatsGlobal(type, elementMap[type]);
                        alert('✅ Görsel yüklendi!');
                    }
                    
                    // Input'u sıfırla
                    event.target.value = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.setEmojiForCategory = function(catName, emoji) {
            state.categoryEmojis[catName] = emoji;
            saveData();
            
            // Form sayfasını kapat ve aç (güncelle)
            const type = Object.keys(state.categories).find(t => state.categories[t].includes(catName));
            if (type) {
                const elementMap = {
                    'products': 'cat-prod-list',
                    'customers': 'cat-cust-list',
                    'expenses': 'cat-exp-list',
                    'returns': 'cat-ret-list'
                };
                window.renderCatsGlobal(type, elementMap[type]);
            }
        };

            renderCategoryManagement(document.getElementById('content'));
            alert('✅ Kategori silindi!');

            else if (type === 'returns') inputId = 'cat-ret-input';

            const value = input.value.trim();
            if (!value) { alert('⚠️ Kategori adı boş olamaz!'); return; }

            state.categories[type].push(value);
            saveData();
            input.value = '';

                'returns': 'cat-ret-list'

            alert('✅ Kategori eklendi!');

                    </div>

                        <div style="font-size: 11px; color: ${theme.textLight};">📊 Toplam Satış</div>
                        <div id="total-sales-profit" style="font-size: 20px; font-weight: bold; color: ${theme.primary};">0₺</div>
                    </div>

                        <div style="font-size: 11px; color: ${theme.textLight};">📦 Satış Adedi</div>
                        <div id="total-items-profit" style="font-size: 20px; font-weight: bold; color: ${theme.warning};">0</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <!-- ÜRÜN BAZINDA KAAR -->
                    <div class="card" style="border-left: 3px solid ${theme.primary};">

                        <div id="product-profit-list" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>

                    <!-- TARİH BAZINDA KAAR -->
                    <div class="card" style="border-left: 3px solid ${theme.primary};">
                        <div style="font-size: 12px; font-weight: bold; color: ${theme.primary}; margin-bottom: 8px;">📅 Tarih Bazında Kâr</div>
                        <div id="date-profit-list" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>
                </div>

                <div class="card" style="border-left: 3px solid ${theme.error};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.error}; margin-bottom: 8px;">📋 Satış Detayları (Silme)</div>
                    <div id="sales-detail" style="max-height: 400px; overflow-y: auto;"></div>
            `;

            // İlk yükleme
            window.filterProfitReport = function() {
                const startDate = document.getElementById('profit-start-date').value;
                const endDate = document.getElementById('profit-end-date').value;
                calculateProfitReport(startDate, endDate);
            };

            window.resetProfitFilter = function() {
                document.getElementById('profit-start-date').value = '';
                document.getElementById('profit-end-date').value = '';
                calculateProfitReport('', '');
            };

            const calculateProfitReport = (startDate, endDate) => {
                let filtered = state.sales;

                if (startDate || endDate) {
                    filtered = filtered.filter(sale => {
                        if (!sale.timestamp) return false;
                        const formattedDate = parseToYYYYMMDD(sale.timestamp);
                        if (!formattedDate) return false;
                        if (startDate && formattedDate < startDate) return false;
                        if (endDate && formattedDate > endDate) return false;
                        return true;
                    });
                }

                // Toplam kâr hesapla
                let totalProfit = 0;
                let totalSales = 0;
                let totalItems = 0;
                const productProfits = {};
                const dateProfits = {};

                filtered.forEach(sale => {
                    sale.items.forEach(item => {
                        const profit = (item.sellPrice - item.buyPrice) * item.qty;
                        totalProfit += profit;
                        totalSales += item.sellPrice * item.qty;
                        totalItems += item.qty;

                        // Ürün bazında
                        if (!productProfits[item.name]) {
                            productProfits[item.name] = { profit: 0, qty: 0, buyTotal: 0, sellTotal: 0 };
                        }
                        productProfits[item.name].profit += profit;
                        productProfits[item.name].qty += item.qty;
                        productProfits[item.name].buyTotal += item.buyPrice * item.qty;
                        productProfits[item.name].sellTotal += item.sellPrice * item.qty;

                        // Tarih bazında
                        const dateOnly = sale.timestamp.split(',')[0]; // "16.07.2026"
                        if (!dateProfits[dateOnly]) {
                            dateProfits[dateOnly] = { profit: 0, qty: 0, sales: 0 };
                        }
                        dateProfits[dateOnly].profit += profit;
                        dateProfits[dateOnly].qty += item.qty;
                        dateProfits[dateOnly].sales += item.sellPrice * item.qty;
                    });
                });

                // Göster: Toplam Kâr
                document.getElementById('total-profit').textContent = totalProfit.toFixed(0) + '₺';
                document.getElementById('total-sales-profit').textContent = totalSales.toFixed(0) + '₺';
                document.getElementById('total-items-profit').textContent = totalItems;

                // Ürün Bazında Kâr
                const productList = document.getElementById('product-profit-list');
                productList.innerHTML = Object.entries(productProfits)
                    .sort((a, b) => b[1].profit - a[1].profit)
                    .map(([name, data]) => `
                        <div style="background: ${theme.background}; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 10px;">
                            <div style="font-weight: bold; color: ${theme.primary};">${name}</div>
                            <div style="color: ${theme.success};">💰 Kâr: ${data.profit.toFixed(0)}₺</div>
                            <div style="color: ${theme.textLight};">📊 Satış: ${data.sellTotal.toFixed(0)}₺ | Maliyet: ${data.buyTotal.toFixed(0)}₺</div>
                            <div style="color: ${theme.textLight};">📦 Adet: ${data.qty} | Marj: %${((data.profit / data.sellTotal) * 100).toFixed(1)}</div>
                        </div>
                    `).join('');

                // Tarih Bazında Kâr
                const dateList = document.getElementById('date-profit-list');
                dateList.innerHTML = Object.entries(dateProfits)
                    .sort((a, b) => new Date(b[0].split('.').reverse().join('-')) - new Date(a[0].split('.').reverse().join('-')))
                    .map(([date, data]) => `
                        <div style="background: ${theme.background}; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 10px;">
                            <div style="font-weight: bold; color: ${theme.primary};">📅 ${date}</div>
                            <div style="color: ${theme.success};">💰 Kâr: ${data.profit.toFixed(0)}₺</div>
                            <div style="color: ${theme.textLight};">💵 Satış: ${data.sales.toFixed(0)}₺ | 📦 Adet: ${data.qty}</div>
                        </div>
                    `).join('');

                // Satış Detayları + Silme Butonları
                const salesDetailDiv = document.querySelector('[id="sales-detail"]');
                if (salesDetailDiv) {
                    salesDetailDiv.innerHTML = filtered.map(sale => `
                        <div style="background: ${theme.card}; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 10px; border-left: 2px solid ${theme.primary};">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 4px;">
                                <div>
                                    <div style="font-weight: bold; color: ${theme.primary};">${sale.invoiceNo}</div>
                                    <div style="color: ${theme.textLight}; font-size: 9px;">${sale.timestamp}</div>
                                </div>
                                <button onclick="deleteSale(${sale.id})" style="padding: 2px 6px; background: ${theme.error}; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 9px;">🗑️</button>
                            </div>
                            <div style="color: ${theme.success}; font-weight: bold;">💰 ${sale.total.toFixed(0)}₺</div>
                            <div style="color: ${theme.textLight}; font-size: 9px;">👤 ${sale.customer}</div>
                        </div>
                    `).join('');
                }
            };

            // İlk render
            calculateProfitReport('', '');
        }

                const actionFilter = document.getElementById('audit-action-filter')?.value || '';
                const startDate = document.getElementById('audit-start-date')?.value || '';
                const endDate = document.getElementById('audit-end-date')?.value || '';
                
                let filtered = state.auditLog || [];
                if (userFilter) filtered = filtered.filter(l => l.user === userFilter);
                if (actionFilter) filtered = filtered.filter(l => l.action && l.action.startsWith(actionFilter));
                
                if (startDate || endDate) {
                    filtered = filtered.filter(l => {
                        if (!l.timestamp) return false;
                        const logDateFormatted = parseToYYYYMMDD(l.timestamp);
                        if (!logDateFormatted) return false;
                        if (startDate && logDateFormatted < startDate) return false;
                        if (endDate && logDateFormatted > endDate) return false;

                const auditDiv = document.getElementById('audit-list');

                if (filtered.length === 0) {

                auditDiv.innerHTML = filtered.slice().reverse().map((log, idx) => `

                        </div>
                        ${log.affectedData ? `
                            <div style="font-size: 9px; background: ${theme.background}; padding: 6px; border-radius: 3px; color: ${theme.textLight}; border-left: 2px solid ${theme.primary};">
                                <strong>📊 Etkilenen Veri:</strong><br>
                                ${log.affectedData}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            };

            window.resetAuditFilter = function() {
                if (document.getElementById('audit-user-filter')) document.getElementById('audit-user-filter').value = '';
                if (document.getElementById('audit-action-filter')) document.getElementById('audit-action-filter').value = '';
                if (document.getElementById('audit-start-date')) document.getElementById('audit-start-date').value = '';
                if (document.getElementById('audit-end-date')) document.getElementById('audit-end-date').value = '';
                filterAuditLog();
            };

            // İlk render
            filterAuditLog();
        }

        // ========== SİLME FONKSİYONLARI ==========
        window.deleteSale = function(saleId) {
            if (!confirm('⚠️ Satışı silmek istediğinize emin misiniz? Stok geri alınacak.')) return;

            const saleIndex = state.sales.findIndex(s => s.id === saleId);
            if (saleIndex === -1) return;

            const sale = state.sales[saleIndex];

            // Stoku geri al
            sale.items.forEach(item => {
                const product = state.products.find(p => p.id === item.id);
                if (product) {
                    if (!product.stockLots) product.stockLots = [];
                    product.stockLots.push({
                        buyPrice: item.buyPrice,
                        sellPrice: item.sellPrice,
                        quantity: item.qty,
                        date: new Date().toLocaleString('tr-TR')
                    });
                    product.warehouse += item.qty;
                }
            });

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Satış Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `Fiş: ${sale.invoiceNo}, Tutar: ${sale.total}₺`,
                affectedData: sale.items.map(i => `${i.name} x${i.qty}`).join(', ')
            });

            state.sales.splice(saleIndex, 1);
            saveData();
            alert('✅ Satış silindi!');
        };

        window.deleteExpense = function(expenseId) {
            if (!confirm('⚠️ Masrafı silmek istediğinize emin misiniz?')) return;

            const expenseIndex = state.expenses.findIndex(e => e.id === expenseId);
            if (expenseIndex === -1) return;

            const expense = state.expenses[expenseIndex];

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Masraf Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `${expense.category}: ${expense.amount}₺`,
                affectedData: null
            });

            state.expenses.splice(expenseIndex, 1);
            saveData();
            alert('✅ Masraf silindi!');
        };

        window.deleteStockLog = function(logId) {
            if (!confirm('⚠️ Stok kaydını silmek istediğinize emin misiniz?')) return;

            const logIndex = state.stockLog.findIndex(l => l.id === logId);
            if (logIndex === -1) return;

            const log = state.stockLog[logIndex];

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Stok Kaydı Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `${log.productName} x${log.quantity}`,
                affectedData: null
            });

            state.stockLog.splice(logIndex, 1);
            saveData();
            alert('✅ Stok kaydı silindi!');
        };

        // ========== BİLDİRİMLER ==========
        function renderNotifications(screen) {
            screen.innerHTML = `
                <div class="card" style="border-left: 3px solid ${theme.primary};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.primary}; margin-bottom: 8px;">🔔 Bildirimler</div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 10px; font-weight: bold;">SMS</label>
                        <input id="sms-text" placeholder="SMS metni..." style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; margin-bottom: 8px; font-size: 11px;" />
                        <button onclick="sendSMS()" style="width: 100%; padding: 6px; background: ${theme.success}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">📲 SMS Gönder</button>
                    </div>

                    <div style="margin-bottom: 12px; border-top: 1px solid ${theme.textLight}; padding-top: 12px;">
                        <label style="font-size: 10px; font-weight: bold;">Email</label>
                        <input id="email-text" placeholder="Email metni..." style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; margin-bottom: 8px; font-size: 11px;" />
                        <button onclick="sendEmail()" style="width: 100%; padding: 6px; background: ${theme.info}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">📧 Email Gönder</button>
                    </div>
                </div>
            `;

            window.sendSMS = function() {
                const text = document.getElementById('sms-text').value;
                if (!text) { alert('⚠️ Mesaj yazın!'); return; }
                state.notifications.push({ type: 'sms', text: text, date: new Date().toLocaleString('tr-TR') });
                saveData();
                alert('✅ SMS gönderildi! (Demo)');
                document.getElementById('sms-text').value = '';
            };

            window.sendEmail = function() {
                const text = document.getElementById('email-text').value;
                if (!text) { alert('⚠️ Mesaj yazın!'); return; }
                state.notifications.push({ type: 'email', text: text, date: new Date().toLocaleString('tr-TR') });
                saveData();
                alert('✅ Email gönderildi! (Demo)');
                document.getElementById('email-text').value = '';
            };
        }

        // ========== EMOJI/RESİM RENDER HELPER ==========
        function renderEmojiOrImage(categoryName, size = '20px') {
            const value = state.categoryEmojis[categoryName] || '📌';
            // Base64 resimse img tag olarak render et
            if (value.startsWith('data:image')) {
                return `<img src="${value}" style="width: ${size}; height: ${size}; border-radius: 4px; object-fit: cover; display: inline-block;" title="${categoryName}" />`;
            }
            // Emoji ise span olarak render et
            return `<span style="font-size: 20px;">${value}</span>`;
        }

        // ========== TEMA SEÇİMİ ==========
        function renderTheme(screen) {
            screen.innerHTML = `
                <div class="grid-2">
                    ${Object.keys(themes).map(key => `
                        <div style="background: ${themes[key].card}; padding: 12px; border-radius: 8px; border: 2px solid ${theme.name === themes[key].name ? themes[key].primary : '#ccc'}; cursor: pointer; text-align: center;" onclick="changeTheme('${key}')">
                            <div style="font-size: 24px; margin-bottom: 6px;">●</div>
                            <div style="font-weight: bold; color: ${themes[key].primary}; font-size: 12px;">${themes[key].name}</div>
                            <div style="font-size: 10px; color: ${themes[key].textLight}; margin-top: 4px;">Seç</div>
                        </div>
                    `).join('')}
                </div>
            `;

            window.changeTheme = function(themeName) {
                theme = themes[themeName];
                try { localStorage.setItem('theme', themeName); } catch(e) {}
                render();
            };
        }

        // ========== BACKUP ==========
        function renderBackup(screen) {
            screen.innerHTML = `
                <div class="card" style="border-left: 3px solid ${theme.primary};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.primary}; margin-bottom: 8px;">⏰ Gün Sonu Saati</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                        <div>
                            <label style="font-size: 10px; font-weight: bold;">Saat</label>
                            <input type="number" id="close-hour" min="0" max="23" placeholder="23" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;" />
                        </div>
                        <div>
                            <label style="font-size: 10px; font-weight: bold;">Dakika</label>
                            <input type="number" id="close-minute" min="0" max="59" placeholder="00" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;" />
                        </div>
                    </div>
                    <button onclick="saveDailyCloseTime()" style="width: 100%; padding: 8px; background: ${theme.success}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">✅ Kaydet</button>
                    <div style="font-size: 10px; color: ${theme.textLight}; margin-top: 8px; padding: 8px; background: ${theme.background}; border-radius: 4px;">
                        <div>📝 Bu saat sonrasında yapılan işlemler</div>
                        <div>ertesi gün olarak kaydedilecektir.</div>
                        <div style="margin-top: 6px; font-weight: bold;" id="close-time-display">Mevcut: ${state.dailyCloseTime ? state.dailyCloseTime.hour + ':' + String(state.dailyCloseTime.minute).padStart(2, '0') : '23:00'}</div>
                    </div>
                </div>

                <div class="card" style="border-left: 3px solid ${theme.success};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.success}; margin-bottom: 8px;">💾 Yedek Oluştur</div>
                    <button onclick="downloadBackup()" style="width: 100%; padding: 8px; background: ${theme.success}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">📥 İndir</button>
                </div>

                <div class="card" style="border-left: 3px solid ${theme.info};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.info}; margin-bottom: 8px;">📤 Geri Yükle</div>
                    <input type="file" id="backup-file" accept=".json" style="width: 100%; padding: 6px; margin-bottom: 8px;" />
                    <button onclick="uploadBackup()" style="width: 100%; padding: 8px; background: ${theme.info}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">📤 Yükle</button>
                </div>
            `;

            // Gün sonu saatini doldur
            if (state.dailyCloseTime) {
                document.getElementById('close-hour').value = state.dailyCloseTime.hour;
                document.getElementById('close-minute').value = state.dailyCloseTime.minute;
            }

            window.saveDailyCloseTime = function() {
                const hour = parseInt(document.getElementById('close-hour').value);
                const minute = parseInt(document.getElementById('close-minute').value);

                if (isNaN(hour) || isNaN(minute) || hour < 0 || hour > 23 || minute < 0 || minute > 59) {
                    alert('⚠️ Geçerli bir saat girin! (00:00 - 23:59)');
                    return;
                }

                state.dailyCloseTime = { hour, minute };
                saveData();
                document.getElementById('close-time-display').textContent = `Mevcut: ${hour}:${String(minute).padStart(2, '0')}`;
                alert('✅ Gün sonu saati kaydedildi!');
            };

            window.downloadBackup = function() {
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `CagdasPetShop_${new Date().toLocaleDateString('tr-TR')}.json`;
                a.click();
            };

            window.uploadBackup = function() {
                const file = document.getElementById('backup-file').files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        Object.assign(state, data);
                        saveData();
                        alert('✅ Veriler geri yüklendi!');
                        render();
                    } catch (err) {
                        alert('❌ Dosya okunamadı!');
                    }
                };
                reader.readAsText(file);
            };
        }

        // ========== START ==========
        render();
    </script>
</body>
</html>
