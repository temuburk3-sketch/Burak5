                            btn.style.color = 'white';
                        } else {
                            btn.style.background = theme.card;
                            btn.style.color = theme.primary;
                        }
                    }
                });

                const startInput = document.getElementById('chart-start-date');
                const endInput = document.getElementById('chart-end-date');
                const now = new Date();

                if (range === '7days') {
                    const d7 = new Date(); d7.setDate(d7.getDate() - 6);
                    if (startInput) startInput.value = parseToYYYYMMDD(d7.toLocaleDateString('tr-TR')) || '';
                    if (endInput) endInput.value = parseToYYYYMMDD(now.toLocaleDateString('tr-TR')) || '';
                } else if (range === '30days') {
                    const d30 = new Date(); d30.setDate(d30.getDate() - 29);
                    if (startInput) startInput.value = parseToYYYYMMDD(d30.toLocaleDateString('tr-TR')) || '';
                    if (endInput) endInput.value = parseToYYYYMMDD(now.toLocaleDateString('tr-TR')) || '';
                } else if (range === 'month') {
                    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                    if (startInput) startInput.value = parseToYYYYMMDD(firstDay.toLocaleDateString('tr-TR')) || '';
                    if (endInput) endInput.value = parseToYYYYMMDD(now.toLocaleDateString('tr-TR')) || '';
                } else if (range === 'all') {
                    if (startInput) startInput.value = '';
                    if (endInput) endInput.value = '';
                }

                window.updateChartsWithRange();
            };

            window.updateChartsWithRange = function() {
                const startDate = document.getElementById('chart-start-date')?.value;
                const endDate = document.getElementById('chart-end-date')?.value;

                let filteredSales = state.sales || [];

                if (startDate || endDate) {
                    filteredSales = filteredSales.filter(s => {
                        if (!s.timestamp) return false;
                        const sDate = parseToYYYYMMDD(s.timestamp);
                        if (!sDate) return false;
                        if (startDate && sDate < startDate) return false;
                        if (endDate && sDate > endDate) return false;
                        return true;
                    });
                }

                // 1. KPI Hesaplamaları
                let totalRev = 0;
                let totalProfit = 0;
                let totalItemsCount = 0;
                let productCounts = {};
                let categoryCounts = {};
                let paymentTotals = { cash: 0, card: 0, credit: 0 };
                let hourlyCounts = Array(24).fill(0);
                let dailyData = {};

                filteredSales.forEach(s => {
                    totalRev += s.total || 0;
                    
                    // Ödeme yöntemi
                    const pay = s.paymentMethod || 'cash';
                    if (paymentTotals[pay] !== undefined) paymentTotals[pay] += s.total || 0;
                    else paymentTotals.cash += s.total || 0;

                    // Saatlik yoğunluk
                    let hour = 12;
                    if (s.timestamp && s.timestamp.includes(':')) {
                        const parts = s.timestamp.split(' ');
                        const timePart = parts.find(p => p.includes(':'));
                        if (timePart) {
                            hour = parseInt(timePart.split(':')[0]) || 12;
                        }
                    }
                    if (hour >= 0 && hour < 24) hourlyCounts[hour]++;

                    // Günlük veriler
                    const dateStr = parseToYYYYMMDD(s.timestamp) || 'Bilinmeyen';
                    if (!dailyData[dateStr]) dailyData[dateStr] = { rev: 0, profit: 0, count: 0 };
                    dailyData[dateStr].rev += s.total || 0;
                    dailyData[dateStr].count++;

                    // Kalem bazlı hesaplamalar
                    let saleProfit = 0;
                    if (s.items && Array.isArray(s.items)) {
                        s.items.forEach(item => {
                            const qty = item.qty || 1;
                            totalItemsCount += qty;
                            const itemProfit = ((item.sellPrice || 0) - (item.buyPrice || 0)) * qty;
                            saleProfit += itemProfit;

                            // Ürün satışı
                            const pName = item.name || 'Bilinmeyen Ürün';
                            productCounts[pName] = (productCounts[pName] || 0) + qty;

                            // Kategori tespiti
                            const prod = state.products.find(p => p.id === item.id || p.name === item.name);
                            const cat = prod ? (prod.category || 'Diğer') : 'Diğer';
                            categoryCounts[cat] = (categoryCounts[cat] || 0) + (item.sellPrice || 0) * qty;
                        });
                    }
                    totalProfit += saleProfit;
                    if (dailyData[dateStr]) dailyData[dateStr].profit += saleProfit;
                });

                // Toplama KPI yazdırma
                const revElem = document.getElementById('kpi-revenue');
                const profitElem = document.getElementById('kpi-profit');
                const marginElem = document.getElementById('kpi-margin-sub');
                const countElem = document.getElementById('kpi-sales-count');
                const basketElem = document.getElementById('kpi-avg-basket');
                const topProdElem = document.getElementById('kpi-top-product');
                const topProdSubElem = document.getElementById('kpi-top-product-sub');

                if (revElem) revElem.textContent = totalRev.toFixed(0) + '₺';
                if (profitElem) profitElem.textContent = totalProfit.toFixed(0) + '₺';
                
                const marginPercent = totalRev > 0 ? ((totalProfit / totalRev) * 100).toFixed(1) : '0';
                if (marginElem) marginElem.textContent = 'Kâr Marjı: %' + marginPercent;

                if (countElem) countElem.textContent = filteredSales.length;
                const avgBasket = filteredSales.length > 0 ? (totalRev / filteredSales.length).toFixed(0) : '0';
                if (basketElem) basketElem.textContent = 'Ort. Fiş: ' + avgBasket + '₺';

                // Lider Ürün
                let topProdName = '-';
                let topProdQty = 0;
                Object.keys(productCounts).forEach(pName => {
                    if (productCounts[pName] > topProdQty) {
                        topProdQty = productCounts[pName];
                        topProdName = pName;
                    }
                });
                if (topProdElem) topProdElem.textContent = topProdName;
                if (topProdSubElem) topProdSubElem.textContent = topProdQty + ' Adet Satıldı';

                // Çizim İşlemleri (Chart.js)
                window.destroyCharts();

                // 1. GRAFİK: CİRO VE NET KÂR GELİŞİMİ
                const ctx1 = document.getElementById('revenueProfitChart')?.getContext('2d');
                if (ctx1) {
                    const sortedDates = Object.keys(dailyData).sort();
                    const labels = sortedDates.map(d => {
                        const pts = d.split('-');
                        return pts.length === 3 ? `${pts[2]}.${pts[1]}` : d;
                    });
                    const revs = sortedDates.map(d => dailyData[d].rev);
                    const profits = sortedDates.map(d => dailyData[d].profit);

                    window.chartInstances['revenueProfitChart'] = new Chart(ctx1, {
                        type: 'line',
                        data: {
                            labels: labels.length > 0 ? labels : ['Veri Yok'],
                            datasets: [
                                {
                                    label: 'Ciro (₺)',
                                    data: revs.length > 0 ? revs : [0],
                                    borderColor: theme.success,
                                    backgroundColor: theme.success + '20',
                                    tension: 0.3,
                                    fill: true
                                },
                                {
                                    label: 'Net Kâr (₺)',
                                    data: profits.length > 0 ? profits : [0],
                                    borderColor: theme.primary,
                                    backgroundColor: theme.primary + '30',
                                    tension: 0.3,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: true, position: 'top' } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                }

                // 2. GRAFİK: ÖDEME YÖNTEMLERİ DAĞILIMI
                const ctx2 = document.getElementById('paymentMethodChart')?.getContext('2d');
                if (ctx2) {
                    window.chartInstances['paymentMethodChart'] = new Chart(ctx2, {
                        type: 'doughnut',
                        data: {
                            labels: ['Nakit', 'Kart', 'Kredi/Veresiye'],
                            datasets: [{
                                data: [paymentTotals.cash, paymentTotals.card, paymentTotals.credit],
                                backgroundColor: [theme.success, theme.primary, theme.warning]
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }

                // 3. GRAFİK: KATEGORİ BAZLI SATIŞ
                const ctx3 = document.getElementById('categoryChart')?.getContext('2d');
                if (ctx3) {
                    const catLabels = Object.keys(categoryCounts);
                    const catValues = Object.values(categoryCounts);
                    const colors = [theme.primary, theme.success, theme.warning, theme.info, theme.error, '#8b5cf6', '#ec4899', '#f59e0b'];

                    window.chartInstances['categoryChart'] = new Chart(ctx3, {
                        type: 'pie',
                        data: {
                            labels: catLabels.length > 0 ? catLabels : ['Veri Yok'],
                            datasets: [{
                                data: catValues.length > 0 ? catValues : [1],
                                backgroundColor: colors.slice(0, Math.max(1, catLabels.length))
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }

                // 4. GRAFİK: EN ÇOK SATAN TOP 5 ÜRÜN
                const ctx4 = document.getElementById('topProductsChart')?.getContext('2d');
                if (ctx4) {
                    const sortedProducts = Object.keys(productCounts)
                        .map(p => ({ name: p, qty: productCounts[p] }))
                        .sort((a, b) => b.qty - a.qty)
                        .slice(0, 5);

                    window.chartInstances['topProductsChart'] = new Chart(ctx4, {
                        type: 'bar',
                        data: {
                            labels: sortedProducts.map(p => p.name),
                            datasets: [{
                                label: 'Satılan Adet',
                                data: sortedProducts.map(p => p.qty),
                                backgroundColor: theme.warning
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { x: { beginAtZero: true } }
                        }
                    });
                }

                // 5. GRAFİK: SAATLİK YOĞUNLUK
                const ctx5 = document.getElementById('hourlyDensityChart')?.getContext('2d');
                if (ctx5) {
                    const hoursLabels = ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'];
                    const hoursData = [
                        hourlyCounts[8] + hourlyCounts[9],
                        hourlyCounts[10] + hourlyCounts[11],
                        hourlyCounts[12] + hourlyCounts[13],
                        hourlyCounts[14] + hourlyCounts[15],
                        hourlyCounts[16] + hourlyCounts[17],
                        hourlyCounts[18] + hourlyCounts[19],
                        hourlyCounts[20] + hourlyCounts[21],
                        hourlyCounts[22] + hourlyCounts[23]
                    ];

                    window.chartInstances['hourlyDensityChart'] = new Chart(ctx5, {
                        type: 'bar',
                        data: {
                            labels: hoursLabels,
                            datasets: [{
                                label: 'Satış İşlem Adedi',
                                data: hoursData,
                                backgroundColor: theme.primary
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                }
            };

            // İlk açılışta 7 Günlük varsayılan yükleme
            setTimeout(() => {
                window.setChartRange('7days');
            }, 100);
        }

        // ========== DÖNEM RAPORU ==========
        function renderPeriod(screen) {
            const now = new Date();
            let month = now.getMonth() + 1, year = now.getFullYear();

            screen.innerHTML = `
                <div class="grid-2" style="margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 10px; font-weight: bold;">Ay</label>
                        <select id="p-month" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;">
                            ${Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1 === month ? 'selected' : ''}>${i+1}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: bold;">Yıl</label>
                        <select id="p-year" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid ${theme.primary}; font-size: 11px;">
                            ${Array.from({length: 5}, (_, i) => {
                                const y = new Date().getFullYear() - i;
                                return `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`;
                            }).join('')}
                        </select>
                    </div>
                </div>
                <div id="period-content"></div>
            `;

            function updatePeriod() {
                const m = parseInt(document.getElementById('p-month').value);
                const y = parseInt(document.getElementById('p-year').value);

                const filtered = state.sales.filter(s => {
                    try {
                        const dateStr = s.timestamp.split(',')[0]; // "16.07.2026"
                        const [day, month, year] = dateStr.split('.');
                        return parseInt(month) === m && parseInt(year) === y;
                    } catch { return true; }
                });

                const revenue = filtered.reduce((s, a) => s + (a.total || 0), 0);
                const expense = state.expenses.reduce((s, a) => s + (a.amount || 0), 0);
                const profit = revenue - expense;

                document.getElementById('period-content').innerHTML = `
                    <div class="grid-2" style="margin-bottom: 12px;">
                        <div class="card" style="border-left: 3px solid ${theme.success}; text-align: center;">
                            <div style="font-size: 10px; color: ${theme.textLight};">💰 Gelir</div>
                            <div style="font-size: 16px; font-weight: bold; color: ${theme.success}; margin-top: 5px;">${revenue.toFixed(0)}₺</div>
                        </div>
                        <div class="card" style="border-left: 3px solid ${theme.error}; text-align: center;">
                            <div style="font-size: 10px; color: ${theme.textLight};">💸 Gider</div>
                            <div style="font-size: 16px; font-weight: bold; color: ${theme.error}; margin-top: 5px;">${expense.toFixed(0)}₺</div>
                        </div>
                        <div class="card" style="border-left: 3px solid ${profit > 0 ? theme.success : theme.error}; text-align: center; grid-column: 1/-1;">
                            <div style="font-size: 10px; color: ${theme.textLight};">📊 Kar</div>
                            <div style="font-size: 18px; font-weight: bold; color: ${profit > 0 ? theme.success : theme.error}; margin-top: 5px;">${profit.toFixed(0)}₺</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('p-month').onchange = updatePeriod;
            document.getElementById('p-year').onchange = updatePeriod;
            updatePeriod();
        }

                document.getElementById('user-username').value = '';
                document.getElementById('user-name').value = '';
                document.getElementById('user-password').value = '';
                document.getElementById('user-role').value = 'cashier';
                document.getElementById('user-status').value = 'active';
                document.getElementById('user-phone').value = '';
                document.getElementById('user-email').value = '';
                document.getElementById('user-username').focus();
            };

            window.hideUserForm = function() {
                editingUserId = null;
                document.getElementById('user-form-card').classList.add('hidden');

            window.editUserModal = function(id) {
                const u = state.users.find(x => x.id === id);
                if (!u) return;

                editingUserId = id;
                document.getElementById('user-form-card').classList.remove('hidden');
                document.getElementById('user-form-title').textContent = `✏️ Kullanıcı Düzenle (#${u.id})`;
                document.getElementById('user-edit-id').value = u.id;
                document.getElementById('user-username').value = u.username || '';
                document.getElementById('user-name').value = u.name || '';
                document.getElementById('user-password').value = u.password || '';
                document.getElementById('user-role').value = u.role || 'cashier';
                document.getElementById('user-status').value = u.status || 'active';
                document.getElementById('user-phone').value = u.phone || '';
                document.getElementById('user-email').value = u.email || '';
                
                document.getElementById('user-form-card').scrollIntoView({ behavior: 'smooth' });
            };

            window.changeUserPasswordDirect = function(id) {
                const u = state.users.find(x => x.id === id);
                if (!u) return;

                const newPass = prompt(`🔑 "${u.name}" (@${u.username}) kullanıcısı için yeni şifre girin:`, u.password || '');
                if (newPass === null) return;
                
                const trimmedPass = newPass.trim();
                if (!trimmedPass) {
                    alert('⚠️ Şifre boş bırakılamaz!');
                    return;
                }

                u.password = trimmedPass;
                saveData();

                if (!Array.isArray(state.auditLog)) state.auditLog = [];
                state.auditLog.push({
                    user: (state.user && state.user.name) ? state.user.name : 'Sistem',
                    action: '🔑 Şifre Değiştirildi',
                    timestamp: new Date().toLocaleString('tr-TR'),
                    details: `"${u.name}" (@${u.username}) şifresi güncellendi.`
                });

                alert(`✅ "${u.name}" kullanıcısının şifresi başarıyla güncellendi!`);
                renderUsers(screen);
            };

            window.toggleUserStatus = function(id) {
                const u = state.users.find(x => x.id === id);
                if (!u) return;

                if (state.user && state.user.id === u.id) {
                    alert('⚠️ Kendi hesabınızı pasife alamazsınız!');
                    return;
                }

                const newStatus = u.status === 'passive' ? 'active' : 'passive';
                u.status = newStatus;
                saveData();

                if (!Array.isArray(state.auditLog)) state.auditLog = [];
                state.auditLog.push({
                    user: (state.user && state.user.name) ? state.user.name : 'Sistem',
                    action: newStatus === 'passive' ? '⏸️ Kullanıcı Pasife Alındı' : '▶️ Kullanıcı Aktifleştirildi',
                    timestamp: new Date().toLocaleString('tr-TR'),
                    details: `"${u.name}" (@${u.username}) durumu: ${newStatus}`
                });

                filterUsersList();
            };

            window.saveUserSubmit = function() {
                const editId = document.getElementById('user-edit-id').value;
                const usernameVal = (document.getElementById('user-username').value || '').trim().toLowerCase().replace(/\s+/g, '');
                const nameVal = (document.getElementById('user-name').value || '').trim();
                const passVal = (document.getElementById('user-password').value || '').trim();
                const roleVal = document.getElementById('user-role').value;
                const statusVal = document.getElementById('user-status').value;
                const phoneVal = (document.getElementById('user-phone').value || '').trim();
                const emailVal = (document.getElementById('user-email').value || '').trim();

                if (!usernameVal) { alert('⚠️ Kullanıcı adı zorunludur!'); return; }
                if (!nameVal) { alert('⚠️ Ad / Soyad zorunludur!'); return; }
                if (!passVal) { alert('⚠️ Şifre zorunludur!'); return; }

                const existingUser = state.users.find(x => x.username.toLowerCase() === usernameVal && String(x.id) !== String(editId));
                if (existingUser) {
                    alert(`⚠️ "${usernameVal}" kullanıcı adı başka bir kullanıcı tarafından kullanılıyor! Lütfen farklı bir kullanıcı adı seçin.`);
                    return;
                }

                if (editId) {
                    const u = state.users.find(x => String(x.id) === String(editId));
                    if (u) {
                        u.username = usernameVal;
                        u.name = nameVal;
                        u.password = passVal;
                        u.role = roleVal;
                        u.status = statusVal;
                        u.phone = phoneVal;
                        u.email = emailVal;

                        if (!Array.isArray(state.auditLog)) state.auditLog = [];
                        state.auditLog.push({
                            user: (state.user && state.user.name) ? state.user.name : 'Sistem',
                            action: '✏️ Kullanıcı Güncellendi',
                            timestamp: new Date().toLocaleString('tr-TR'),
                            details: `"${u.name}" (@${u.username}) güncellendi.`
                        });

                        alert('✅ Kullanıcı bilgileri başarıyla güncellendi!');
                    }
                } else {
                    const newUser = {
                        id: Date.now(),
                        username: usernameVal,
                        name: nameVal,
                        password: passVal,
                        role: roleVal,
                        status: statusVal,
                        phone: phoneVal,
                        email: emailVal,
                        createdAt: new Date().toLocaleString('tr-TR')
                    };
                    state.users.push(newUser);

                    if (!Array.isArray(state.auditLog)) state.auditLog = [];
                    state.auditLog.push({
                        user: (state.user && state.user.name) ? state.user.name : 'Sistem',
                        action: '➕ Kullanıcı Eklendi',
                        timestamp: new Date().toLocaleString('tr-TR'),
                        details: `"${newUser.name}" (@${newUser.username}) rol: ${newUser.role}`
                    });

                    alert('✅ Yeni kullanıcı başarıyla eklendi!');
                }

                saveData();
                hideUserForm();
                renderUsers(screen);
            };

            window.filterUsersList = function() {
                const query = (document.getElementById('user-search-query')?.value || '').toLowerCase().trim();
                const roleFilter = document.getElementById('user-filter-role')?.value || '';
                const statusFilter = document.getElementById('user-filter-status')?.value || '';

                let filtered = state.users || [];

                if (query) {
                    filtered = filtered.filter(u => 
                        (u.username || '').toLowerCase().includes(query) ||
                        (u.name || '').toLowerCase().includes(query) ||
                        (u.email || '').toLowerCase().includes(query) ||
                        (u.phone || '').includes(query)
                    );
                }

                if (roleFilter) {
                    filtered = filtered.filter(u => u.role === roleFilter);

                if (statusFilter) {
                    filtered = filtered.filter(u => (u.status || 'active') === statusFilter);
                }

                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: ${theme.textLight}; padding: 20px; font-size: 11px;">📭 Kriterlere uygun kullanıcı bulunamadı.</div>`;

                }

                container.innerHTML = filtered.map(u => {

                                    ✏️ Düzenle

                                </button>

            window.deleteUser = function(id) {
                const u = state.users.find(x => x.id === id);
                if (!u) return;

                if (state.user && state.user.id === id) {
                    alert('⚠️ Kendi hesabınızı silemezsiniz!');
                    return;
                }

                if (state.users.length <= 1) {
                    alert('⚠️ Sistemde en az bir kullanıcı bulunmalıdır!');
                    return;
                }

                const adminCount = state.users.filter(x => x.role === 'admin' && x.id !== id).length;
                if (u.role === 'admin' && adminCount === 0) {
                    alert('⚠️ Sistemde en az bir yönetici hesabı bulunmalıdır! Bu yöneticiyi silemezsiniz.');
                    return;
                }

                if (!confirm(`⚠️ "${u.name}" (@${u.username}) kullanıcısını silmek istediğinizden emin misiniz?`)) {
                    return;
                }

                state.users = state.users.filter(x => x.id !== id);
                saveData();

                if (!Array.isArray(state.auditLog)) state.auditLog = [];
                state.auditLog.push({
                    user: (state.user && state.user.name) ? state.user.name : 'Sistem',
                    action: '🗑️ Kullanıcı Silindi',
                    timestamp: new Date().toLocaleString('tr-TR'),
                    details: `"${u.name}" (@${u.username}) silindi.`
                });

                alert('✅ Kullanıcı silindi!');
                renderUsers(screen);
            };

            filterUsersList();
        }

                const endDateInput = document.getElementById('stock-filter-end-date')?.value || '';

                let filtered = state.stockLog || [];
                
                // Ürün ismi yazıyla ara
                if (productSearch) {
                    filtered = filtered.filter(log => 
                        (log.productName || '').toLowerCase().includes(productSearch)
                    );
                }

                // Tip filtresi
                if (type) {
                    filtered = filtered.filter(log => log.type === type);
                }

                // Tarih filtresi - Tek Tarih veya Tarih Aralığı
                const startDate = startDateInput || singleDateInput;
                const endDate = endDateInput || singleDateInput;

                if (startDate || endDate) {
                    filtered = filtered.filter(log => {
                        if (!log.date) return false;
                        const logDateFormatted = parseToYYYYMMDD(log.date);
                        if (!logDateFormatted) return false;

                        if (startDate && logDateFormatted < startDate) return false;
                        if (endDate && logDateFormatted > endDate) return false;
                        return true;
                    });
                }

                const list = document.getElementById('stock-log-list');
                if (!list) return;

                if (filtered.length === 0) {
                    list.innerHTML = `<div style="text-align: center; color: ${theme.textLight}; font-size: 11px; padding: 12px;">📭 Sonuç bulunamadı</div>`;
                    return;
                }

                list.innerHTML = filtered.slice().reverse().map(log => `

                        </div>
                        <div style="color: ${log.type === 'in' ? theme.success : theme.error}; font-weight: bold;">${log.type === 'in' ? '📈 Giriş' : '📉 Çıkış'}: ${log.quantity} Adet</div>
                        <div style="color: ${theme.textLight};">📅 ${log.date} | Kullanıcı: ${log.user || 'Sistem'}</div>
                        <div style="color: ${theme.textLight};">Not: ${log.note || '-'}</div>
                    </div>
                `).join('');
            };

            window.clearDateFilter = function() {
                const singleElem = document.getElementById('stock-filter-date');
                const startElem = document.getElementById('stock-filter-start-date');
                const endElem = document.getElementById('stock-filter-end-date');
                if (singleElem) singleElem.value = '';
                if (startElem) startElem.value = '';
                if (endElem) endElem.value = '';
                filterStockLog();
            };

            // İlk yükleme
            filterStockLog();
        }

        window.toggleEmojiPicker = function(type, idx) {

            }
        };

        window.triggerImageUpload = function(catName) {
            document.getElementById(`image-upload-${catName}`).click();
        };

        window.handleImageUpload = function(event, catName) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Canvas'ta compress et (64x64)
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 64, 64);
                    
                    // DataURL'e çevir
                    const compressedImage = canvas.toDataURL('image/png');
                    
                    // Kategoriye ata
                    state.categoryEmojis[catName] = compressedImage;
                    saveData();
                    
                    // Formu kapat ve aç (güncelle)
                    const type = Object.keys(state.categories).find(t => state.categories[t].includes(catName));
                    if (type) {
                        const elementMap = {
                            'products': 'cat-prod-list',
                            'customers': 'cat-cust-list',
                            'expenses': 'cat-exp-list',
                            'returns': 'cat-ret-list'
                        };
                        window.renderCatsGlobal(type, elementMap[type]);
                        alert('✅ Görsel yüklendi!');
                    }
                    
                    // Input'u sıfırla
                    event.target.value = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

            else if (type === 'returns') inputId = 'cat-ret-input';

            if (!input) return;
            
            const value = input.value.trim();
            if (!value) { alert('⚠️ Kategori adı boş olamaz!'); return; }
            if (state.categories[type].includes(value)) { alert('⚠️ Bu kategori zaten var!'); return; }

            state.categories[type].push(value);

            alert('✅ Kategori eklendi!');

        // ========== MALİ RAPORLAR ==========
        function renderMaliRaporlari(screen) {
            screen.innerHTML = `

                        <div id="total-sales-profit" style="font-size: 20px; font-weight: bold; color: ${theme.primary};">0₺</div>
                    </div>
                    <div class="card" style="border-left: 3px solid ${theme.warning};">
                        <div style="font-size: 11px; color: ${theme.textLight};">📦 Satış Adedi</div>
                        <div id="total-items-profit" style="font-size: 20px; font-weight: bold; color: ${theme.warning};">0</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <!-- ÜRÜN BAZINDA KAAR -->
                    <div class="card" style="border-left: 3px solid ${theme.primary};">
                        <div style="font-size: 12px; font-weight: bold; color: ${theme.primary}; margin-bottom: 8px;">📦 Ürün Bazında Kâr</div>
                        <div id="product-profit-list" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>

                    <!-- TARİH BAZINDA KAAR -->
                    <div class="card" style="border-left: 3px solid ${theme.primary};">
                        <div style="font-size: 12px; font-weight: bold; color: ${theme.primary}; margin-bottom: 8px;">📅 Tarih Bazında Kâr</div>
                        <div id="date-profit-list" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>
                </div>

                <div class="card" style="border-left: 3px solid ${theme.error};">
                    <div style="font-size: 12px; font-weight: bold; color: ${theme.error}; margin-bottom: 8px;">📋 Satış Detayları (Silme)</div>
                    <div id="sales-detail" style="max-height: 400px; overflow-y: auto;"></div>
            `;

            // İlk yükleme
            window.filterProfitReport = function() {
                const startDate = document.getElementById('profit-start-date').value;
                const endDate = document.getElementById('profit-end-date').value;
                calculateProfitReport(startDate, endDate);
            };

            window.resetProfitFilter = function() {
                document.getElementById('profit-start-date').value = '';
                document.getElementById('profit-end-date').value = '';
                calculateProfitReport('', '');
            };

            const calculateProfitReport = (startDate, endDate) => {
                let filtered = state.sales;

                if (startDate || endDate) {
                    filtered = filtered.filter(sale => {
                        if (!sale.timestamp) return false;
                        const formattedDate = parseToYYYYMMDD(sale.timestamp);
                        if (!formattedDate) return false;
                        if (startDate && formattedDate < startDate) return false;
                        if (endDate && formattedDate > endDate) return false;
                        return true;
                    });
                }

                // Toplam kâr hesapla
                let totalProfit = 0;
                let totalSales = 0;
                let totalItems = 0;
                const productProfits = {};
                const dateProfits = {};

                filtered.forEach(sale => {
                    sale.items.forEach(item => {
                        const profit = (item.sellPrice - item.buyPrice) * item.qty;
                        totalProfit += profit;
                        totalSales += item.sellPrice * item.qty;
                        totalItems += item.qty;

                        // Ürün bazında
                        if (!productProfits[item.name]) {
                            productProfits[item.name] = { profit: 0, qty: 0, buyTotal: 0, sellTotal: 0 };
                        }
                        productProfits[item.name].profit += profit;
                        productProfits[item.name].qty += item.qty;
                        productProfits[item.name].buyTotal += item.buyPrice * item.qty;
                        productProfits[item.name].sellTotal += item.sellPrice * item.qty;

                        // Tarih bazında
                        const dateOnly = sale.timestamp.split(',')[0]; // "16.07.2026"
                        if (!dateProfits[dateOnly]) {
                            dateProfits[dateOnly] = { profit: 0, qty: 0, sales: 0 };
                        }
                        dateProfits[dateOnly].profit += profit;
                        dateProfits[dateOnly].qty += item.qty;
                        dateProfits[dateOnly].sales += item.sellPrice * item.qty;
                    });
                });

                // Göster: Toplam Kâr
                document.getElementById('total-profit').textContent = totalProfit.toFixed(0) + '₺';
                document.getElementById('total-sales-profit').textContent = totalSales.toFixed(0) + '₺';
                document.getElementById('total-items-profit').textContent = totalItems;

                // Ürün Bazında Kâr
                const productList = document.getElementById('product-profit-list');
                productList.innerHTML = Object.entries(productProfits)
                    .sort((a, b) => b[1].profit - a[1].profit)
                    .map(([name, data]) => `
                        <div style="background: ${theme.background}; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 10px;">
                            <div style="font-weight: bold; color: ${theme.primary};">${name}</div>
                            <div style="color: ${theme.success};">💰 Kâr: ${data.profit.toFixed(0)}₺</div>
                            <div style="color: ${theme.textLight};">📊 Satış: ${data.sellTotal.toFixed(0)}₺ | Maliyet: ${data.buyTotal.toFixed(0)}₺</div>

            // Hızlı tarih ayarlama helper'ı
            window.setDetailedProfitQuickDate = function(range) {
                const sEl = document.getElementById('net-start-date');
                const eEl = document.getElementById('net-end-date');
                if (!sEl || !eEl) return;

                const now = new Date();
                const todayFormatted = now.toISOString().split('T')[0];

                if (range === 'today') {
                    sEl.value = todayFormatted;
                    eEl.value = todayFormatted;
                } else if (range === 'yesterday') {
                    const y = new Date(now);
                    y.setDate(y.getDate() - 1);
                    const yFormatted = y.toISOString().split('T')[0];
                    sEl.value = yFormatted;
                    eEl.value = yFormatted;
                } else if (range === 'this_week') {
                    const firstDay = new Date(now);
                    const day = now.getDay() || 7;
                    firstDay.setDate(now.getDate() - day + 1);
                    sEl.value = firstDay.toISOString().split('T')[0];
                    eEl.value = todayFormatted;
                } else if (range === 'this_month') {
                    const firstDayMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                    sEl.value = firstDayMonth.toISOString().split('T')[0];
                    eEl.value = todayFormatted;
                } else if (range === 'all') {
                    sEl.value = '';
                    eEl.value = '';
                }
                window.calculateNetProfitReport();
            };

            // Ana Hesaplama Fonksiyonu
            window.calculateNetProfitReport = function() {
                const startDate = document.getElementById('net-start-date')?.value || '';
                const endDate = document.getElementById('net-end-date')?.value || '';
                const vatRate = (parseFloat(document.getElementById('net-vat-rate')?.value) || 20) / 100;
                const vatType = document.getElementById('net-vat-type')?.value || 'included';
                const extraDiscountRate = (parseFloat(document.getElementById('net-discount-rate')?.value) || 0) / 100;
                const deductExpenses = document.getElementById('net-deduct-expenses')?.checked ?? true;
                const deductReturns = document.getElementById('net-deduct-returns')?.checked ?? true;
                const searchQuery = (document.getElementById('net-item-search')?.value || '').trim().toLowerCase();

                // 1. Satışları Filtrele
                let filteredSales = state.sales || [];
                if (startDate || endDate) {
                    filteredSales = filteredSales.filter(sale => {
                        if (!sale.timestamp) return false;
                        const formattedDate = parseToYYYYMMDD(sale.timestamp);
                        if (!formattedDate) return false;
                        if (startDate && formattedDate < startDate) return false;
                        if (endDate && formattedDate > endDate) return false;
                        return true;
                    });
                }

                // Akümülatörler
                let totalGrossSales = 0;
                let totalDiscount = 0;
                let totalBuyCost = 0;
                let totalVatAmount = 0;
                let totalItemsQty = 0;

                const dailyMap = {};
                const detailedItems = [];

                filteredSales.forEach(sale => {
                    const dateStr = sale.timestamp ? sale.timestamp.split(',')[0].trim() : 'Tarihsiz';

                    if (!dailyMap[dateStr]) {
                        dailyMap[dateStr] = {
                            date: dateStr,
                            gross: 0,
                            discount: 0,
                            cost: 0,
                            vat: 0,
                            count: 0
                        };
                    }

                    (sale.items || []).forEach(item => {
                        const qty = parseFloat(item.qty) || 1;
                        const sellPrice = parseFloat(item.sellPrice) || 0;
                        const buyPrice = parseFloat(item.buyPrice) || 0;

                        const itemGross = sellPrice * qty;
                        const itemDiscount = itemGross * extraDiscountRate;
                        const itemNetAfterDiscount = itemGross - itemDiscount;

                        // KDV hesabı
                        let itemVat = 0;
                        let itemNetSalesExVat = itemNetAfterDiscount;

                        if (vatType === 'included') {
                            itemNetSalesExVat = itemNetAfterDiscount / (1 + vatRate);
                            itemVat = itemNetAfterDiscount - itemNetSalesExVat;
                        } else {
                            itemVat = itemNetAfterDiscount * vatRate;
                            itemNetSalesExVat = itemNetAfterDiscount;
                        }

                        const itemBuyCostTotal = buyPrice * qty;
                        const itemNetProfit = itemNetSalesExVat - itemBuyCostTotal;

                        totalGrossSales += itemGross;
                        totalDiscount += itemDiscount;
                        totalBuyCost += itemBuyCostTotal;
                        totalVatAmount += itemVat;
                        totalItemsQty += qty;

                        dailyMap[dateStr].gross += itemGross;
                        dailyMap[dateStr].discount += itemDiscount;
                        dailyMap[dateStr].cost += itemBuyCostTotal;
                        dailyMap[dateStr].vat += itemVat;
                        dailyMap[dateStr].count += qty;

                        // Arama filtresi
                        const matchesSearch = !searchQuery || 
                            (sale.invoiceNo || '').toLowerCase().includes(searchQuery) ||
                            (item.name || '').toLowerCase().includes(searchQuery) ||
                            (sale.customer || '').toLowerCase().includes(searchQuery);

                        if (matchesSearch) {
                            detailedItems.push({
                                invoiceNo: sale.invoiceNo || 'INV-0',
                                timestamp: sale.timestamp,
                                customer: sale.customer || 'Peşin Alıcı',
                                name: item.name || 'Ürün',
                                qty: qty,
                                buyPrice: buyPrice,
                                sellPrice: sellPrice,
                                gross: itemGross,
                                discount: itemDiscount,
                                vat: itemVat,
                                cost: itemBuyCostTotal,
                                netProfit: itemNetProfit,
                                margin: itemNetSalesExVat > 0 ? (itemNetProfit / itemNetSalesExVat) * 100 : 0
                            });
                        }
                    });
                });

                // Giderler
                let totalExpenses = 0;
                if (deductExpenses && Array.isArray(state.expenses)) {
                    state.expenses.forEach(exp => {
                        if (!exp.date) return;
                        const expFormatted = parseToYYYYMMDD(exp.date);
                        if (startDate && expFormatted < startDate) return;
                        if (endDate && expFormatted > endDate) return;
                        totalExpenses += parseFloat(exp.amount) || 0;
                    });
                }

                // İadeler
                let totalReturns = 0;
                if (deductReturns && Array.isArray(state.returns)) {
                    state.returns.forEach(ret => {
                        const retDate = ret.date || ret.timestamp || '';
                        if (!retDate) return;
                        const retFormatted = parseToYYYYMMDD(retDate);
                        if (startDate && retFormatted < startDate) return;
                        if (endDate && retFormatted > endDate) return;
                        totalReturns += parseFloat(ret.refundAmount || ret.total) || 0;
                    });
                }

                const totalExpAndRet = totalExpenses + totalReturns;

                const netSalesExcludingVat = vatType === 'included' 
                    ? (totalGrossSales - totalDiscount) / (1 + vatRate) 
                    : (totalGrossSales - totalDiscount);

                const finalNetProfit = netSalesExcludingVat - totalBuyCost - totalExpAndRet;
                const finalProfitMargin = netSalesExcludingVat > 0 ? (finalNetProfit / netSalesExcludingVat) * 100 : 0;

                </div>
            `;

            window.filterAuditLog = function() {
                const userFilter = document.getElementById('audit-user-filter')?.value || '';
                const actionFilter = document.getElementById('audit-action-filter')?.value || '';
                const startDate = document.getElementById('audit-start-date')?.value || '';
                const endDate = document.getElementById('audit-end-date')?.value || '';
                
                let filtered = state.auditLog || [];
                if (userFilter) filtered = filtered.filter(l => l.user === userFilter);
                if (actionFilter) filtered = filtered.filter(l => l.action && l.action.startsWith(actionFilter));
                
                if (startDate || endDate) {
                    filtered = filtered.filter(l => {
                        if (!l.timestamp) return false;
                        const logDateFormatted = parseToYYYYMMDD(l.timestamp);
                        if (!logDateFormatted) return false;
                        if (startDate && logDateFormatted < startDate) return false;
                        if (endDate && logDateFormatted > endDate) return false;
                        return true;
                    });
                }

                const auditDiv = document.getElementById('audit-list');
                if (!auditDiv) return;
                
                if (filtered.length === 0) {
                    auditDiv.innerHTML = '<div style="text-align: center; color: ' + theme.textLight + '; padding: 20px;">📭 İşlem bulunamadı</div>';
                    return;

                        </div>

                            📌 ${log.details}
                        </div>

                                <strong>📊 Etkilenen Veri:</strong><br>
                                ${log.affectedData}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            };

            window.resetAuditFilter = function() {
                if (document.getElementById('audit-user-filter')) document.getElementById('audit-user-filter').value = '';
                if (document.getElementById('audit-action-filter')) document.getElementById('audit-action-filter').value = '';
                if (document.getElementById('audit-start-date')) document.getElementById('audit-start-date').value = '';
                if (document.getElementById('audit-end-date')) document.getElementById('audit-end-date').value = '';
                filterAuditLog();
            };

            // İlk render
            filterAuditLog();
        }

        // ========== SİLME FONKSİYONLARI ==========
        window.deleteSale = function(saleId) {
            if (!confirm('⚠️ Satışı silmek istediğinize emin misiniz? Stok geri alınacak.')) return;

            const saleIndex = state.sales.findIndex(s => s.id === saleId);
            if (saleIndex === -1) return;

            const sale = state.sales[saleIndex];

            // Stoku geri al
            sale.items.forEach(item => {
                const product = state.products.find(p => p.id === item.id);
                if (product) {
                    if (!product.stockLots) product.stockLots = [];
                    product.stockLots.push({
                        buyPrice: item.buyPrice,
                        sellPrice: item.sellPrice,
                        quantity: item.qty,
                        date: new Date().toLocaleString('tr-TR')
                    });
                    product.warehouse += item.qty;
                }
            });

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Satış Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `Fiş: ${sale.invoiceNo}, Tutar: ${sale.total}₺`,
                affectedData: sale.items.map(i => `${i.name} x${i.qty}`).join(', ')
            });

            state.sales.splice(saleIndex, 1);
            saveData();
            alert('✅ Satış silindi!');
        };

                const cust = (state.customers || []).find(c => c.name && c.name.toLowerCase() === sale.customer.toLowerCase());

            let cleanPhone = phone.replace(/\D/g, '');

----------------------------------
📄 *Fiş No:* ${sale.invoiceNo}
📅 *Tarih:* ${sale.timestamp || new Date().toLocaleString('tr-TR')}

🙏 Bizi tercih ettiğiniz için teşekkür ederiz!

            const expense = state.expenses[expenseIndex];

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Masraf Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `${expense.category}: ${expense.amount}₺`,
                affectedData: null
            });

            state.expenses.splice(expenseIndex, 1);
            saveData();
            alert('✅ Masraf silindi!');
        };

        window.deleteStockLog = function(logId) {
            if (!confirm('⚠️ Stok kaydını silmek istediğinize emin misiniz?')) return;

            const logIndex = state.stockLog.findIndex(l => l.id === logId);
            if (logIndex === -1) return;

            const log = state.stockLog[logIndex];

            // Audit log
            state.auditLog.push({
                user: state.user.name,
                action: '🗑️ Stok Kaydı Silindi',
                timestamp: new Date().toLocaleString('tr-TR'),
                details: `${log.productName} x${log.quantity}`,
                affectedData: null
            });

            state.stockLog.splice(logIndex, 1);
            saveData();
            alert('✅ Stok kaydı silindi!');

                const prim = document.getElementById('ctrl-primary-color')?.value || theme.primary;
                const sec = document.getElementById('ctrl-secondary-color')?.value || theme.secondary || prim;

                const text = document.getElementById('ctrl-text-color')?.value || theme.text;
                const op = document.getElementById('ctrl-bg-opacity') ? parseFloat(document.getElementById('ctrl-bg-opacity').value) : theme.bgOpacity;
                const blur = document.getElementById('ctrl-bg-blur') ? parseInt(document.getElementById('ctrl-bg-blur').value, 10) : theme.bgBlur;
                const font = document.getElementById('ctrl-font-family')?.value || theme.fontFamily;
                const glass = document.getElementById('ctrl-glass-toggle') ? document.getElementById('ctrl-glass-toggle').checked : theme.cardGlass;

                theme.primary = prim;

                window.persistCurrentTheme();
                applyThemeStyles();

            };

            window.setPresetPattern = function(patternKey) {
                theme.bgImage = presetPatterns[patternKey] || '';
                theme.bgVideo = '';
                window.persistCurrentTheme();
                applyThemeStyles();
                updateLivePreviewBox();
            };

            window.handleBgFileUpload = function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxDim = 650;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        theme.bgImage = canvas.toDataURL('image/jpeg', 0.55);
                        theme.bgVideo = '';
                        if (theme.bgOpacity === undefined || theme.bgOpacity < 0.5) theme.bgOpacity = 0.85;
                        window.persistCurrentTheme();
                        applyThemeStyles();
                        window.switchThemeTab('background');
                        updateLivePreviewBox();
                        alert('✅ Arka plan duvar kağıdı yüklendi ve uygulandı!');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            window.clearCustomBgImage = function() {
                theme.bgImage = '';
                window.persistCurrentTheme();
                applyThemeStyles();
                window.switchThemeTab('background');
                updateLivePreviewBox();
            };

            window.setCardRadius = function(radiusStr) {
                theme.cardRadius = radiusStr;
                applyThemeStyles();
                window.switchThemeTab('typography');
                updateLivePreviewBox();
            };

            function updateLivePreviewBox() {
                const previewName = document.getElementById('preview-theme-name');
                if (previewName) previewName.textContent = theme.name || 'Özel Tema';
            }

            window.saveAndApplyCustomTheme = function() {
                try {
                    if (state.user) {
                        const uKey = (state.user.username || state.user.name || 'user').toLowerCase().trim();
                        if (!state.userThemes) state.userThemes = {};
                        state.userThemes[uKey] = Object.assign({}, theme);
                        state.user.userTheme = Object.assign({}, theme);
                        localStorage.setItem('cagdas_user_theme_' + uKey, JSON.stringify(theme));
                    }
                    localStorage.setItem('cagdas_custom_theme', JSON.stringify(theme));
                    state.customTheme = Object.assign({}, theme);
                    saveData();
                    applyThemeStyles();
                    alert('✅ Tema ayarları bu hesaba özel olarak kaydedildi ve uygulandı!');
                    render();
                } catch(e) {
                    console.error(e);
                    alert('⚠️ Tema kaydedilirken hata oluştu.');
                }
            };

            window.resetToDefaultTheme = function() {
                if (!confirm('Varsayılan Mor temaya dönmek istediğinizden emin misiniz?')) return;
                theme = Object.assign({}, themes.purple);
                if (state.user) {
                    const uKey = (state.user.username || state.user.name || 'user').toLowerCase().trim();
                    if (state.userThemes && state.userThemes[uKey]) {
                        delete state.userThemes[uKey];
                    }
                    delete state.user.userTheme;
                    try { localStorage.removeItem('cagdas_user_theme_' + uKey); } catch(e){}
                }
                try { localStorage.removeItem('cagdas_custom_theme'); } catch(e){}
                delete state.customTheme;
                saveData();
                applyThemeStyles();
                render();
                alert('✅ Hesabınız için varsayılan tema yüklendi!');
            };

            // İlk sekme yüklemesi
            window.switchThemeTab('presets');
        }

        // ========== BACKUP & CLOUD SYNC ==========
        function renderBackup(screen) {
            if (!Array.isArray(state.cloudSnapshots)) state.cloudSnapshots = [];

            const lastSyncTime = state.lastCloudBackupTime ? new Date(state.lastCloudBackupTime).toLocaleString('tr-TR') : 'Otomatik Canlı Senkronize Ediliyor';

            screen.innerHTML = `
                <!-- BULUT OTOMATİK SENKRONİZASYON VE CANLI VERİTABANI -->
                <div class="card" style="border-left: 4px solid ${theme.primary}; background: linear-gradient(135deg, ${theme.card}, ${theme.background});">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div style="font-size: 13px; font-weight: bold; color: ${theme.primary}; display: flex; align-items: center; gap: 6px;">
                            ☁️ Bulut Otomatik Senkronizasyon (Firebase & Sunucu)
                        </div>
                        <span id="backup-cloud-status-badge" style="padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; background: ${theme.success}20; color: ${theme.success};">
                            🟢 Canlı Bağlı
                        </span>
                    </div>
                    <div style="font-size: 11px; color: ${theme.textLight}; margin-bottom: 12px; line-height: 1.5;">
                        Tüm satışlar, stoklar, borçlar ve müşteri hareketleri anlık olarak bulut veritabanında otomatik yedeklenir. Cihazınız bozulsa dahi verileriniz kaybolmaz.
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                        <button onclick="manualCloudBackup()" style="flex: 1; padding: 8px 12px; background: ${theme.primary}; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                            ☁️ Şimdi Buluta Yedekle
                        </button>
                        <button onclick="fetchFromCloudManual()" style="flex: 1; padding: 8px 12px; background: ${theme.card}; color: ${theme.primary}; border: 1px solid ${theme.primary}; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                            🔄 Buluttan Son Veriyi Çek
                        </button>
                    </div>
                    <div style="font-size: 9px; color: ${theme.textLight}; font-style: italic;">
                        Son Bulut Senkronizasyonu: <strong id="last-sync-time-display">${lastSyncTime}</strong>
                    </div>
                </div>

                <!-- GÜNLÜK BULUT SNAPSHOT GERİ YÜKLEME NOKTALARI -->
                <div class="card" style="border-left: 4px solid ${theme.info};">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div style="font-size: 12px; font-weight: bold; color: ${theme.info}; display: flex; align-items: center; gap: 6px;">
                            📸 Otomatik Bulut Zaman/Geri Yükleme Noktaları (Snapshots)
                        </div>
                        <button onclick="createCloudSnapshot()" style="padding: 4px 10px; background: ${theme.info}; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold;">
                            ➕ Yeni Snapshot Al
                        </button>
                    </div>
                    <div style="font-size: 10px; color: ${theme.textLight}; margin-bottom: 10px;">
                        Yanlışlıkla veri silinmesi durumunda geçmiş bir tarihteki yedek noktasına tek tıkla geri dönebilirsiniz.
                    </div>
                    
                    <div id="cloud-snapshots-list" style="max-height: 180px; overflow-y: auto; background: ${theme.background}; border-radius: 6px; padding: 6px; border: 1px solid ${theme.info}30;">
                        ${state.cloudSnapshots.length === 0 ? `
                            <div style="font-size: 10px; color: ${theme.textLight}; text-align: center; padding: 12px;">Henüz manuel alınmış snapshot yedeği yok. Günlük otomatik snapshotlar burada listelenir.</div>
                        ` : state.cloudSnapshots.slice().reverse().map((snap, idx) => `
                            <div style="display: flex; justify-content: space-between; align-items: center; background: ${theme.card}; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 10px; border-left: 3px solid ${theme.info};">
                                <div>
                                    <div style="font-weight: bold; color: ${theme.text};">📌 ${snap.title || 'Bulut Yedeği'}</div>
                                    <div style="font-size: 8px; color: ${theme.textLight};">📅 ${snap.date} | 📦 ${snap.productCount} Ürün | 🛒 ${snap.salesCount} Satış</div>
                                </div>
                                <button onclick="restoreCloudSnapshot(${snap.id})" style="padding: 4px 8px; background: ${theme.warning}; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold;">
                                    ⏪ Geri Yükle
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- GOOGLE DRIVE & YEREL YEDEK DOKÜMANLARI -->
                <div class="card" style="border-left: 4px solid #4285F4;">
                    <div style="font-size: 12px; font-weight: bold; color: #4285F4; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">

                    </div>
                    <div style="font-size: 10px; color: ${theme.textLight}; margin-bottom: 10px;">
                        Verilerinizi Google Drive klasörünüze kaydedebilir veya yedek dosyanızdan tüm sistemi restore edebilirsiniz.
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                        <button onclick="downloadGoogleDriveBackup()" style="padding: 8px; background: #4285F4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                            📥 Drive Yedeği İndir
                        </button>
                        <button onclick="document.getElementById('backup-file-drive').click()" style="padding: 8px; background: ${theme.success}; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;">

                <div class="card" style="border-left: 4px solid ${theme.warning};">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">

                    <button onclick="saveDailyCloseTime()" style="width: 100%; padding: 8px; background: ${theme.warning}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">✅ Kaydet</button>
                    <div style="font-size: 10px; color: ${theme.textLight}; margin-top: 8px; padding: 8px; background: ${theme.background}; border-radius: 4px;">
                        <div>📝 Bu saat sonrasında yapılan işlemler ertesi gün olarak kaydedilir ve gün sonu bulut yedeği otomatik alınır.</div>
                        <div style="margin-top: 4px; font-weight: bold;" id="close-time-display">Mevcut: ${state.dailyCloseTime ? state.dailyCloseTime.hour + ':' + String(state.dailyCloseTime.minute).padStart(2, '0') : '23:00'}</div>
                    </div>
                </div>
            `;

            // Gün sonu saatini doldur
            if (state.dailyCloseTime) {
                document.getElementById('close-hour').value = state.dailyCloseTime.hour;
                document.getElementById('close-minute').value = state.dailyCloseTime.minute;
            }

            window.manualCloudBackup = function() {
                if (typeof window.syncStateToCloud === 'function') {
                    state.lastCloudBackupTime = new Date().toISOString();
                    window.syncStateToCloud();
                    alert("✅ Veriler anında bulut sunucusuna gönderildi ve senkronize edildi!");
                    renderBackup(screen);
                } else {
                    alert("⚠️ Bulut veritabanı bağlantısı henüz başlatılmadı veya çevrimdışı.");
                }
            };

            window.fetchFromCloudManual = function() {
                if (window.firebaseDocRef && window.getDocFromFirebase) {
                    window.getDocFromFirebase();
                } else {
                    location.reload();
                }
            };

            window.createCloudSnapshot = function() {
                if (!Array.isArray(state.cloudSnapshots)) state.cloudSnapshots = [];
                const now = new Date();
                const snapshotName = prompt("Snapshot / Yedek Adı Giriniz:", `Yedek_${now.toLocaleDateString('tr-TR')}_${now.getHours()}:${now.getMinutes()}`);
                if (!snapshotName) return;

                const snapshot = {
                    id: Date.now(),
                    title: snapshotName,
                    date: now.toLocaleString('tr-TR'),
                    productCount: (state.products || []).length,
                    salesCount: (state.sales || []).length,
                    dataState: JSON.parse(JSON.stringify(state))
                };

                // Remove snapshots data inside snapshot to avoid recursion
                delete snapshot.dataState.cloudSnapshots;

                state.cloudSnapshots.push(snapshot);
                if (state.cloudSnapshots.length > 20) {
                    state.cloudSnapshots.shift(); // keep max 20 snapshots
                }

                saveData();
                alert(`✅ "${snapshotName}" snapshot yedeği oluşturuldu ve buluta gönderildi!`);
                renderBackup(screen);
            };

            window.restoreCloudSnapshot = function(snapId) {
                const snap = (state.cloudSnapshots || []).find(s => s.id === snapId);
                if (!snap) { alert("⚠️ Snapshot bulunamadı!"); return; }

                if (confirm(`⚠️ DİKKAT: "${snap.title}" (${snap.date}) tarihli yedeğe geri dönmek istediğinize emin misiniz?\nMevcut veriler bu yedekle değiştirilecektir.`)) {
                    const savedSnapshots = state.cloudSnapshots;
                    Object.assign(state, JSON.parse(JSON.stringify(snap.dataState)));
                    state.cloudSnapshots = savedSnapshots;
                    saveData();
                    alert("✅ Sistem başarıyla seçilen snapshot yedeğine geri yüklendi!");
                    render();
                }
            };

            window.downloadGoogleDriveBackup = function() {
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const d = new Date();
                const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                a.download = `CagdasPetShop_GoogleDriveYedek_${dateStr}.json`;
                a.click();
            };

            window.uploadDriveBackup = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!confirm("⚠️ Bu dosyadaki verileri sisteme yüklemek istediğinize emin misiniz?")) return;
                        Object.assign(state, data);
                        saveData();
                        alert('✅ Veriler Google Drive yedek dosyasından başarıyla geri yüklendi!');
                        render();
                    } catch (err) {
                        alert('❌ Yedek dosyası geçersiz veya bozuk!');
                    }
                };
                reader.readAsText(file);
            };

            window.saveDailyCloseTime = function() {
                const hour = parseInt(document.getElementById('close-hour').value);
                const minute = parseInt(document.getElementById('close-minute').value);

                if (isNaN(hour) || isNaN(minute) || hour < 0 || hour > 23 || minute < 0 || minute > 59) {
                    alert('⚠️ Geçerli bir saat girin! (00:00 - 23:59)');
                    return;
                }

                state.dailyCloseTime = { hour, minute };
                saveData();
                document.getElementById('close-time-display').textContent = `Mevcut: ${hour}:${String(minute).padStart(2, '0')}`;
                alert('✅ Gün sonu saati kaydedildi!');
            };
        }

        // ========== START ==========
        render();
    </script>

    <!-- Firebase Firestore Real-Time Cloud Sync Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "famous-muse-mwjkk",
            appId: "1:956168864787:web:64b98b8734cf0fbcf92be6",
            apiKey: "AIzaSyCihcBytkZfsQapPI_Orp4V-pg_02dcZrQ",
            authDomain: "famous-muse-mwjkk.firebaseapp.com",
            storageBucket: "famous-muse-mwjkk.firebasestorage.app",
            messagingSenderId: "956168864787"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app, "ai-studio-burak4-1d18b16b-5ffb-4ed5-809d-d875ce3bb6e6");
            const docRef = doc(db, "appData", "cagdas");

            window.firebaseCloudDb = db;
            window.firebaseDocRef = docRef;

            let isRemoteUpdate = false;
            let saveTimeout = null;

            function updateCloudSyncUI(status) {
                const el = document.getElementById("cloud-sync-badge");
                if (!el) return;
                if (status === "synced") {
                    el.innerHTML = "☁️ Bulut Canlı Senkronize";
                    el.style.background = "rgba(16, 185, 129, 0.3)";
                    el.style.color = "#ffffff";
                } else if (status === "saving") {
                    el.innerHTML = "🔄 Buluta Aktarılıyor...";
                    el.style.background = "rgba(245, 158, 11, 0.3)";
                    el.style.color = "#ffffff";
                } else if (status === "error") {
                    el.innerHTML = "⚠️ Çevrimdışı / Yerel Mod";
                    el.style.background = "rgba(239, 68, 68, 0.3)";
                    el.style.color = "#ffffff";
                }
            }

            // Real-Time Sync Listener
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const remoteData = snapshot.data();
                    if (remoteData && remoteData.data && window.state) {
                        isRemoteUpdate = true;
                        Object.assign(window.state, remoteData.data);
                        ['products', 'customers', 'suppliers', 'sales', 'expenses', 'returns', 'cart', 'debts', 'stockLog', 'cashLog', 'notifications', 'users'].forEach(key => {
                            if (!Array.isArray(window.state[key])) window.state[key] = [];
                        });
                        if (typeof window.normalizeUsersList === 'function') {
                            window.normalizeUsersList();
                        }
                        try {
                            localStorage.setItem('cagdas', JSON.stringify(window.state));
                        } catch(e) {}

                        updateCloudSyncUI("synced");

                        if (typeof window.renderScreen === 'function') {
                            window.renderScreen();
                        } else if (typeof window.render === 'function') {
                            window.render();
                        }
                        setTimeout(() => { isRemoteUpdate = false; }, 300);
                    }
                } else {
                    // Seed Firestore if empty
                    window.syncStateToCloud();
                }
            }, (error) => {
                console.warn("Firestore listener note:", error);
                updateCloudSyncUI("synced");
            });

            window.syncStateToCloud = function() {
                if (isRemoteUpdate || !window.state) return;
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(async () => {
                    try {
                        updateCloudSyncUI("saving");
                        await setDoc(docRef, {
                            data: window.state,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                        updateCloudSyncUI("synced");
                    } catch(err) {
                        console.error("Cloud sync error:", err);
                        updateCloudSyncUI("error");
                    }
                }, 400);
            };

            // Initial sync trigger
            window.syncStateToCloud();
        } catch(err) {
            console.error("Firebase init error:", err);
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('PWA Service Worker aktif:', reg.scope);
                }).catch(err => {
                    console.warn('Service Worker kaydı yapılamadı:', err);
                });
            });
        }
    </script>
